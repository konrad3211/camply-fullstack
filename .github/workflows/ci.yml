name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy Camply to VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: camply-production
      cancel-in-progress: false

    steps:
      - name: Deploy tested commit over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[0-9.]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]

          umask 077
          SSH_DIR="$(mktemp -d "$RUNNER_TEMP/camply-ssh.XXXXXX")"
          trap 'rm -rf -- "$SSH_DIR"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

          ssh -F /dev/null \
            -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-camply '$GITHUB_SHA'"

      - name: Check public API
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://camply.konradpatla.pl/api/health
